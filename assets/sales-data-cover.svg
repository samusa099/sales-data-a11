<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">Sales Data Analysis Assessment 11 cover</title>
  <desc id="desc">Professional cover for an Excel to Power BI sales analytics project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.55" stop-color="#eef7f5"/>
      <stop offset="1" stop-color="#fff8dc"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122238"/>
      <stop offset="1" stop-color="#1d3653"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#10243e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="600" rx="30" fill="url(#bg)"/>
  <circle cx="1450" cy="85" r="150" fill="#f2c811" opacity="0.16"/>
  <circle cx="1380" cy="550" r="190" fill="#217346" opacity="0.08"/>
  <circle cx="90" cy="520" r="150" fill="#0f6cbd" opacity="0.07"/>

  <g transform="translate(95 82)">
    <rect x="0" y="0" width="138" height="36" rx="18" fill="#0f6cbd"/>
    <text x="69" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">ASSESSMENT 11</text>

    <text x="0" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#10243e">Sales Data Analysis</text>
    <text x="0" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#34526f">Excel → Power Query → Power BI</text>
    <text x="0" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#526b82">A practical analytics portfolio project for reviewing, modelling,</text>
    <text x="0" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#526b82">visualising and validating order-level sales information.</text>

    <g transform="translate(0 300)">
      <g>
        <rect width="190" height="76" rx="18" fill="#ffffff" stroke="#d9e5ef"/>
        <rect width="9" height="76" rx="5" fill="#217346"/>
        <text x="28" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#217346">SOURCE DATA</text>
        <text x="28" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Orders.xlsx</text>
      </g>
      <g transform="translate(214 0)">
        <rect width="190" height="76" rx="18" fill="#ffffff" stroke="#d9e5ef"/>
        <rect width="9" height="76" rx="5" fill="#0f6cbd"/>
        <text x="28" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f6cbd">TRANSFORM</text>
        <text x="28" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Power Query</text>
      </g>
      <g transform="translate(428 0)">
        <rect width="190" height="76" rx="18" fill="#ffffff" stroke="#d9e5ef"/>
        <rect width="9" height="76" rx="5" fill="#f2c811"/>
        <text x="28" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#8a6f00">VISUALISE</text>
        <text x="28" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#17324d">Power BI</text>
      </g>
    </g>

    <text x="0" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#10243e">MUSA</text>
    <text x="62" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#60768b">• HR Professional • Data Analytics Practitioner</text>
