  <g transform="translate(930 84)" filter="url(#shadow)">
    <rect x="0" y="0" width="545" height="390" rx="26" fill="#ffffff" stroke="#dce7ef"/>
    <rect x="28" y="28" width="489" height="306" rx="16" fill="url(#screen)"/>
    <rect x="54" y="56" width="132" height="58" rx="12" fill="#ffffff" opacity="0.96"/>
