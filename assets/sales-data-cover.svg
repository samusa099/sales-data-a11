    <text x="70" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#122238">Dashboard</text>

    <rect x="202" y="56" width="128" height="58" rx="12" fill="#ffffff" opacity="0.96"/>
    <text x="218" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6a7d90">ORDERS</text>
    <text x="218" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#122238">Insights</text>

    <rect x="346" y="56" width="145" height="58" rx="12" fill="#f2c811"/>
    <text x="362" y="79" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#5f5100">POWER BI</text>
    <text x="362" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#1b2430">Report</text>

    <rect x="54" y="138" width="286" height="165" rx="14" fill="#ffffff" opacity="0.97"/>
    <line x1="80" y1="275" x2="316" y2="275" stroke="#d5dee7"/>
    <line x1="80" y1="165" x2="80" y2="275" stroke="#d5dee7"/>
    <path d="M80 254 C120 228,145 242,178 202 S238 220,270 174 S302 181,316 158" fill="none" stroke="#0f6cbd" stroke-width="8" stroke-linecap="round"/>
    <circle cx="178" cy="202" r="7" fill="#217346"/>
    <circle cx="270" cy="174" r="7" fill="#f2c811"/>

    <rect x="356" y="138" width="135" height="165" rx="14" fill="#ffffff" opacity="0.97"/>
    <rect x="380" y="244" width="18" height="35" rx="5" fill="#9dc9e8"/>
    <rect x="409" y="210" width="18" height="69" rx="5" fill="#0f6cbd"/>
    <rect x="438" y="178" width="18" height="101" rx="5" fill="#217346"/>
    <rect x="467" y="150" width="18" height="129" rx="5" fill="#f2c811"/>

    <path d="M115 357 H430 L476 383 H69 Z" fill="#d9e3eb"/>
    <rect x="205" y="365" width="135" height="8" rx="4" fill="#a9b8c5"/>
