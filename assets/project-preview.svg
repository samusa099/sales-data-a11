  <text x="720" y="858" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6d8091">Designed project preview — open eOrderid_powerbi.pbix in Power BI Desktop for the actual interactive report.</text>
</svg>