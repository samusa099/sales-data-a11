<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sales analytics project preview</title>
  <desc id="desc">Designed preview illustrating an Excel to Power BI sales analytics dashboard workflow.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11283e"/>
      <stop offset="1" stop-color="#1d3c59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10243e" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="28" fill="url(#page)"/>
  <text x="80" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#10243e">Project Preview</text>
  <text x="80" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#60768b">Designed overview of the Excel-to-Power BI analytics experience</text>

  <g transform="translate(80 145)" filter="url(#shadow)">
    <rect width="1280" height="670" rx="24" fill="#ffffff"/>
    <rect width="210" height="670" rx="24" fill="url(#nav)"/>
    <rect x="190" width="20" height="670" fill="url(#nav)"/>

    <circle cx="55" cy="56" r="22" fill="#f2c811"/>
    <rect x="88" y="38" width="88" height="12" rx="6" fill="#ffffff" opacity="0.96"/>
    <rect x="88" y="58" width="62" height="8" rx="4" fill="#8ea4b8"/>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#dce8f1">
      <text x="44" y="138">Overview</text>
      <text x="44" y="194">Orders</text>
      <text x="44" y="250">Products</text>
      <text x="44" y="306">Customers</text>
      <text x="44" y="362">Trends</text>
      <text x="44" y="418">Data Quality</text>
    </g>
    <rect x="22" y="105" width="166" height="50" rx="12" fill="#ffffff" opacity="0.12"/>
    <rect x="22" y="112" width="5" height="36" rx="3" fill="#f2c811"/>

    <rect x="235" y="28" width="1018" height="74" rx="16" fill="#f8fbfd" stroke="#e2eaf0"/>
    <text x="270" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243e">Sales Performance Dashboard</text>
    <text x="270" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7e90">Assessment 11 • Excel source • Power Query transformation • Power BI reporting</text>
    <rect x="1084" y="47" width="136" height="36" rx="18" fill="#f2c811"/>
    <text x="1152" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#4b4200">REPORT VIEW</text>

    <g transform="translate(235 126)">
      <g>
        <rect width="230" height="104" rx="16" fill="#ffffff" stroke="#dfe7ed"/>
        <rect width="8" height="104" rx="4" fill="#0f6cbd"/>
        <text x="28" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6a7d90">TOTAL SALES</text>
        <text x="28" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#10243e">Validated</text>
        <text x="28" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#217346">Source-to-report control</text>
      </g>
      <g transform="translate(250 0)">
