      <text x="28" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6a7d90">Illustrative report visual — open the PBIX for the interactive version</text>
      <line x1="55" y1="210" x2="610" y2="210" stroke="#dce5ec"/>
      <line x1="55" y1="88" x2="55" y2="210" stroke="#dce5ec"/>
      <line x1="55" y1="170" x2="610" y2="170" stroke="#eef2f5"/>
      <line x1="55" y1="130" x2="610" y2="130" stroke="#eef2f5"/>
      <path d="M55 195 C110 186,140 162,192 174 S278 128,330 144 S410 107,465 119 S548 72,610 92" fill="none" stroke="#0f6cbd" stroke-width="7" stroke-linecap="round"/>
      <path d="M55 200 C118 196,148 183,205 187 S295 171,350 166 S438 143,500 150 S565 128,610 137" fill="none" stroke="#217346" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
      <circle cx="330" cy="144" r="7" fill="#f2c811"/>
      <circle cx="465" cy="119" r="7" fill="#7b61a8"/>
    </g>

    <g transform="translate(901 252)">
      <rect width="352" height="248" rx="18" fill="#ffffff" stroke="#dfe7ed"/>
      <text x="26" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#10243e">Category Contribution</text>
      <circle cx="176" cy="142" r="70" fill="none" stroke="#edf1f4" stroke-width="28"/>
      <path d="M176 72 A70 70 0 0 1 236 178" fill="none" stroke="#0f6cbd" stroke-width="28" stroke-linecap="round"/>
      <path d="M236 178 A70 70 0 0 1 128 200" fill="none" stroke="#217346" stroke-width="28" stroke-linecap="round"/>
      <path d="M128 200 A70 70 0 0 1 106 112" fill="none" stroke="#f2c811" stroke-width="28" stroke-linecap="round"/>
      <text x="176" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6a7d90">SALES</text>
      <text x="176" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243e">Mix</text>
