        <rect width="8" height="104" rx="4" fill="#217346"/>
        <text x="28" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6a7d90">ORDER RECORDS</text>
        <text x="28" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#10243e">Reviewed</text>
        <text x="28" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#217346">Blank and duplicate checks</text>
