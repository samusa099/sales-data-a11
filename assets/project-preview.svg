        <text x="28" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="800" fill="#10243e">Connected</text>
        <text x="28" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8a6f00">Relationships and filters</text>
      </g>
      <g transform="translate(750 0)">
