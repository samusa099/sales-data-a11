    <g transform="translate(235 522)">
      <rect width="1018" height="116" rx="18" fill="#ffffff" stroke="#dfe7ed"/>
      <text x="26" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#10243e">Analytics Workflow</text>
      <g transform="translate(26 52)" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">
        <rect width="156" height="42" rx="12" fill="#e7f3eb"/>
        <text x="78" y="27" text-anchor="middle" fill="#217346">Excel Source</text>
        <text x="178" y="27" fill="#91a2b2">→</text>
        <rect x="202" width="172" height="42" rx="12" fill="#e6f1f9"/>
        <text x="288" y="27" text-anchor="middle" fill="#0f6cbd">Power Query</text>
        <text x="398" y="27" fill="#91a2b2">→</text>
        <rect x="422" width="172" height="42" rx="12" fill="#fff6c7"/>
        <text x="508" y="27" text-anchor="middle" fill="#7c6500">Data Model</text>
        <text x="618" y="27" fill="#91a2b2">→</text>
        <rect x="642" width="172" height="42" rx="12" fill="#f0ebf8"/>
        <text x="728" y="27" text-anchor="middle" fill="#6d509c">Dashboard</text>
        <text x="838" y="27" fill="#91a2b2">→</text>
        <rect x="862" width="130" height="42" rx="12" fill="#eef4f8"/>
        <text x="927" y="27" text-anchor="middle" fill="#405a70">Insights</text>
      </g>
